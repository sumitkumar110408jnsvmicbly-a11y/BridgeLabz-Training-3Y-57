<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Gallery</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:0 15px}
input,textarea,button{font-size:14px;padding:8px;margin-top:6px}
input,textarea{width:100%;border:2px solid #aaa;border-radius:4px}
button{cursor:pointer;border:1px solid #888;border-radius:4px;background:#f2f2f2}
button:hover{background:#e4e4e4}
.error{color:red;font-size:13px;min-height:16px;display:block}
.success{background:#e6f7e6;color:green;padding:10px;border-radius:4px;margin-top:12px}
</style>
<style>
body{max-width:720px}
#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#gallery img{width:100%;border-radius:6px;cursor:pointer;display:block}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center}
#overlay.open{display:flex}
#modal{background:#fff;padding:12px;border-radius:8px;max-width:90vw}
#modal img{display:block;width:600px;max-width:100%}
</style>
</head>
<body>
<h2>Image Gallery</h2>
<div id="gallery"></div>
<div id="overlay">
  <div id="modal"><img id="modalImage" alt="Large preview"></div>
</div>
<script src="q5_image_gallery.js"></script>
</body>
</html>
