<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme Switcher</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:0 15px}
input,textarea,button{font-size:14px;padding:8px;margin-top:6px}
input,textarea{width:100%;border:2px solid #aaa;border-radius:4px}
button{cursor:pointer;border:1px solid #888;border-radius:4px;background:#f2f2f2}
button:hover{background:#e4e4e4}
.error{color:red;font-size:13px;min-height:16px;display:block}
.success{background:#e6f7e6;color:green;padding:10px;border-radius:4px;margin-top:12px}
</style>
<style>
body{transition:background .3s,color .3s;min-height:100vh}
body.theme-light{background:#ffffff;color:#222}
body.theme-dark{background:#1e1e1e;color:#f1f1f1}
body.theme-blue{background:#d6e8ff;color:#0b2a55}
#themeButtons{display:flex;gap:8px;margin:15px 0}
</style>
</head>
<body>
<h2>Theme Switcher</h2>
<div id="themeButtons">
  <button data-theme-name="light">Light</button>
  <button data-theme-name="dark">Dark</button>
  <button data-theme-name="blue">Blue</button>
</div>
<p id="themeInfo"></p>
<script src="q4_theme_switcher.js"></script>
</body>
</html>
