<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mouse Coordinates Logger</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:0 15px}
input,textarea,button{font-size:14px;padding:8px;margin-top:6px}
input,textarea{width:100%;border:2px solid #aaa;border-radius:4px}
button{cursor:pointer;border:1px solid #888;border-radius:4px;background:#f2f2f2}
button:hover{background:#e4e4e4}
.error{color:red;font-size:13px;min-height:16px;display:block}
.success{background:#e6f7e6;color:green;padding:10px;border-radius:4px;margin-top:12px}
</style>
<style>
body{max-width:460px}
#box{position:relative;width:400px;height:400px;border:2px solid #333;background:#f7f7f7;cursor:crosshair;overflow:hidden}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:red;pointer-events:none}
#coordinates{margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<h2>Mouse Coordinates Logger</h2>
<div id="box"></div>
<p id="coordinates">Move the mouse inside the box. Double-click to drop a dot.</p>
<script src="q7_mouse_logger.js"></script>
</body>
</html>
